openapi: 3.0.3
info:
  title: Tata Backend API
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      summary: Register user
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Login user
      responses:
        '200':
          description: OK
  /categories:
    get:
      summary: List categories
      responses:
        '200':
          description: OK
  /products:
    get:
      summary: List products
      responses:
        '200':
          description: OK
  /cart/me:
    get:
      summary: Get current user cart
      responses:
        '200':
          description: OK
  /cart/items:
    post:
      summary: Add item to cart
      responses:
        '201':
          description: Created
  /checkout:
    post:
      summary: Create order from cart
      responses:
        '201':
          description: Created
  /orders/me:
    get:
      summary: List current user orders
      responses:
        '200':
          description: OK
  /payments:
    post:
      summary: Register payment
      responses:
        '201':
          description: Created
  /payments/pending:
    get:
      summary: List pending payments (admin or vendedor)
      responses:
        '200':
          description: OK
  /payments/{paymentId}/verify:
    patch:
      summary: Verify payment (admin or vendedor)
      responses:
        '200':
          description: OK
  /payments/orders/{orderId}:
    get:
      summary: List payments for one order (owner/admin/vendedor)
      responses:
        '200':
          description: OK
  /orders/{orderId}/installments:
    get:
      summary: List installments for one order (owner/admin/vendedor)
      responses:
        '200':
          description: OK
  /shipments/me:
    get:
      summary: List current user shipments
      responses:
        '200':
          description: OK
  /shipments:
    get:
      summary: List shipments (admin/vendedor)
      responses:
        '200':
          description: OK
  /shipments/{shipmentId}/status:
    patch:
      summary: Update shipment status (admin/vendedor)
      responses:
        '200':
          description: OK
  /invoices/{orderId}:
    get:
      summary: Get invoice payload for an order
      responses:
        '200':
          description: OK
  /invoices/{orderId}/pdf:
    get:
      summary: Download invoice PDF
      responses:
        '200':
          description: OK
  /reports/sales:
    get:
      summary: Sales report with export csv/json (admin/vendedor)
      responses:
        '200':
          description: OK
  /reports/collections:
    get:
      summary: Collections report with export csv/json (admin/vendedor)
      responses:
        '200':
          description: OK
  /reports/inventory:
    get:
      summary: Inventory report with export csv/json (admin/vendedor)
      responses:
        '200':
          description: OK
  /notifications/me:
    get:
      summary: List current user notifications
      responses:
        '200':
          description: OK
  /notifications/{notificationId}/read:
    patch:
      summary: Mark notification as read
      responses:
        '200':
          description: OK
  /configurations:
    get:
      summary: List system configs (admin)
      responses:
        '200':
          description: OK
    post:
      summary: Set system config (admin), supports bcv_rate, tax_percent, installment_interest_percent, company_name, company_tax_id
      responses:
        '201':
          description: Created
